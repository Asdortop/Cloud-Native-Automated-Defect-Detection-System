# k8s/pdb.yaml
# ─────────────────────────────────────────────────────────────────────────────
# PodDisruptionBudget — ensures at least 1 pod stays alive during voluntary
# disruptions (node drain, rolling upgrades, Kind node restarts).
#
# Without a PDB, a `kubectl drain` could remove ALL pods simultaneously,
# causing 100 % downtime even when HPA has 2+ replicas running.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: defect-serving-pdb
  namespace: defect-inspection
  labels:
    app: defect-serving
spec:
  # At least 1 pod must be available at all times during disruptions.
  # Change to minAvailable: 2 once you regularly run 3+ replicas.
  minAvailable: 1
  selector:
    matchLabels:
      app: defect-serving
