version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Defect Inspection — Full Local Stack  (with streaming pipeline)
#
# Services                                 URL
# ────────                                 ───
#  serving           FastAPI inference     http://localhost:8080
#  inference-worker  Kafka consumer        (background daemon)
#  redpanda          Kafka-API broker      localhost:9092
#  redpanda-console  Streaming UI          http://localhost:8090
#  minio             S3 object storage     http://localhost:9001 (console)
#  postgres          Metadata + results    localhost:5432
#  mlflow            Experiment tracking   http://localhost:5000
#  prometheus        Metrics scraping      http://localhost:9090
#  grafana           Dashboards            http://localhost:3000
#
# Quick start
# ──────────
#   docker compose -f docker/docker-compose.yml up -d
#
# Credentials (dev-only defaults)
# ─────────────────────────────────────
#   MinIO     : minioadmin / minioadmin
#   Postgres  : mlflow / mlflow
#   Grafana   : admin / admin
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# Common environment shared by every service that talks to Kafka
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
  KAFKA_TOPIC_IMAGES: new-images
  KAFKA_TOPIC_RESULTS: inference-results
  KAFKA_TOPIC_DLQ: inference-dlq

# Common environment for Postgres access
x-postgres-env: &postgres-env
  POSTGRES_DSN: "postgresql://mlflow:mlflow@postgres:5432/mlflow"

networks:
  defect-net:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
  redpanda_data:
  prometheus_data:
  grafana_data:

services:

  # ── 1. FastAPI Serving ─────────────────────────────────────────────────────
  serving:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: defect-serving
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro
    environment:
      <<: [*kafka-env, *postgres-env]
      ONNX_MODEL_PATH: /app/models/defect_efficientnet_b0.onnx
      CLASS_NAMES: "Crazing,Inclusion,Patches,Pitted_surface,Rolled-in_scale,Scratches"
      LOG_LEVEL: info
      HOST: 0.0.0.0
      PORT: "8080"
    depends_on:
      mlflow:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    networks:
      - defect-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ── 2. Inference Worker (Kafka consumer) ───────────────────────────────────
  inference-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: inference-worker
    restart: unless-stopped
    # Override the default uvicorn CMD — run the consumer daemon instead
    command: ["python", "-m", "src.serving.consumer"]
    volumes:
      - ../models:/app/models:ro
      - ../data:/app/data:ro
    environment:
      <<: [*kafka-env, *postgres-env]
      ONNX_MODEL_PATH: /app/models/defect_efficientnet_b0.onnx
      CLASS_NAMES: "Crazing,Inclusion,Patches,Pitted_surface,Rolled-in_scale,Scratches"
      KAFKA_GROUP_ID: inference-worker
      KAFKA_AUTO_OFFSET_RESET: latest
      # MinIO credentials for s3:// image path resolution
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - defect-net
    logging: *default-logging

  # ── 3. Redpanda (Kafka-API-compatible broker) ──────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.1.1
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode dev-container          # single-node dev preset (no ZK needed)
      - --overprovisioned
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      # Two listeners:
      #   internal (29092) — container-to-container inside defect-net
      #   external  (9092) — host access (producer running outside Docker)
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
      - --schema-registry-addr 0.0.0.0:8081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --default-log-level=warn
    ports:
      - "9092:9092"    # Kafka API  (host → container)
      - "8081:8081"    # Schema Registry
      - "9644:9644"    # Admin/Metrics API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - defect-net
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  # Redpanda topic initialiser — one-shot, exits after creating topics
  redpanda-init:
    image: redpandadata/redpanda:v24.1.1
    container_name: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - defect-net
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BROKERS="redpanda:29092"

        echo "Creating Redpanda topics..."

        # new-images   — camera events; 6 partitions → 6 parallel consumers
        rpk topic create new-images \
            --brokers $$BROKERS \
            --partitions 6 \
            --replicas 1 \
            --config retention.ms=86400000 \
            || true

        # inference-results — downstream consumers can read predictions
        rpk topic create inference-results \
            --brokers $$BROKERS \
            --partitions 6 \
            --replicas 1 \
            --config retention.ms=604800000 \
            || true

        # inference-dlq — failed messages land here for later inspection
        rpk topic create inference-dlq \
            --brokers $$BROKERS \
            --partitions 3 \
            --replicas 1 \
            --config retention.ms=2592000000 \
            || true

        echo "Topics:"
        rpk topic list --brokers $$BROKERS
        echo "Redpanda init complete."
    restart: "no"

  # Redpanda Console — web UI for topics, consumer groups, messages
  redpanda-console:
    image: redpandadata/console:v2.5.2
    container_name: redpanda-console
    restart: unless-stopped
    ports:
      - "8090:8080"     # → http://localhost:8090
    environment:
      KAFKA_BROKERS: redpanda:29092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - defect-net
    logging: *default-logging

  # ── 4. MinIO ───────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    networks:
      - defect-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  minio-init:
    image: minio/mc:RELEASE.2024-03-13T23-51-57Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - defect-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/mlflow-artifacts &&
        mc mb --ignore-existing local/defect-models &&
        mc mb --ignore-existing local/camera-images &&
        echo 'MinIO buckets ready.' &&
        exit 0
      "
    restart: "no"

  # ── 5. PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
    networks:
      - defect-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ── 6. MLflow ─────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.3
    container_name: mlflow-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - defect-net
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
        --backend-store-uri  postgresql://mlflow:mlflow@postgres:5432/mlflow
        --default-artifact-root s3://mlflow-artifacts/
        --host 0.0.0.0
        --port 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ── 7. Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      serving:
        condition: service_healthy
    networks:
      - defect-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ── 8. Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: >-
        /etc/grafana/provisioning/dashboards/defect_api.json
    depends_on:
      - prometheus
    networks:
      - defect-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
