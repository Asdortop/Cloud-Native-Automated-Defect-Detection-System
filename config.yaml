# config.yaml
# -----------
# Central configuration file for the defect-inspection training pipeline.
# All values here are overridable via CLI:
#   python src/training/train.py --config config.yaml lr=3e-4

# ── Data ──────────────────────────────────────────────────────────────────
data:
  train_dir: data/raw/train        # path relative to project root
  val_dir:   data/raw/val          # set to null to auto-split from train_dir
  val_split: 0.2                   # fraction used for val when val_dir is null
  num_workers: 4                   # DataLoader worker processes
  image_size: 224                  # must match transforms.IMAGE_SIZE

# ── Model ─────────────────────────────────────────────────────────────────
model:
  name: efficientnet_b0            # torchvision model name
  pretrained: true                 # load ImageNet weights
  dropout: 0.3                     # dropout in custom classification head

# ── Training ──────────────────────────────────────────────────────────────
training:
  epochs: 30
  batch_size: 32
  lr: 1.0e-3                       # initial learning rate (AdamW)
  weight_decay: 1.0e-4
  lr_scheduler: cosine             # cosine | step | none
  lr_step_size: 10                 # used only when scheduler = step
  lr_gamma: 0.1                    # used only when scheduler = step
  early_stopping_patience: 7       # epochs without val-loss improvement
  grad_clip: 1.0                   # max-norm gradient clipping (0 = off)
  seed: 42

# ── MLflow ────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: defect-inspection
  run_name: null                   # null → auto-generated by MLflow
  log_model: true                  # register trained model in MLflow Model Registry
